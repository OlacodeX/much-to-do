apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config
  namespace: muchtodo

data:
  PORT: "8080"
  APP_PORT: "8080"
  DB_NAME: much_todo_db
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ENABLE_CACHE: "false"
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  JWT_EXPIRATION_HOURS: "72"
