name: Frontend CI/CD

on:
  push:
    branches:
      - feature/full-stack
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run lint

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://${{ secrets.ALB_DNS_NAME }}
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment notification
        run: |
          echo "## Frontend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 bucket: ${{ secrets.S3_BUCKET }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CloudFront: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Frontend deployed to S3 and CloudFront invalidation started"
