name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack

jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Server/MuchToDo

    steps:

      # -------------------------
      # CHECKOUT CODE
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # -------------------------
      # SETUP GO
      # -------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache-dependency-path: Server/MuchToDo/go.sum

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Download Dependencies
        run: go mod download

      # -------------------------
      # RUN TESTS
      # -------------------------
      - name: Run Tests
        run: go test ./...

      # -------------------------
      # GOLANG LINT
      # -------------------------
      - name: Run Golang Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          working-directory: Server/MuchToDo

      # -------------------------
      # CONFIGURE AWS
      # -------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # -------------------------
      # LOGIN TO ECR
      # -------------------------
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.2

      # -------------------------
      # BUILD IMAGE
      # -------------------------
      - name: Build Docker Image
        run: docker build -t assessment-backend .

      # -------------------------
      # TAG IMAGE
      # -------------------------
      - name: Tag Docker Image
        run: |
          docker tag assessment-backend:latest \
          ${{ secrets.ECR_REPOSITORY }}:latest

      # -------------------------
      # PUSH IMAGE
      # -------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      # -------------------------
      # VULNERABILITY SCAN
      # -------------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY }}:latest
          format: table
          exit-code: 0

      # -------------------------
      # INSTANCE REFRESH
      # -------------------------
      - name: Refresh Auto Scaling Group
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
        run: |
          if [ -z "$ASG_NAME" ]; then
            echo "ASG_NAME secret is not set — skipping instance refresh"
            exit 0
          fi
          if ! aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" 2>refresh.err; then
            if grep -q InstanceRefreshInProgress refresh.err; then
              echo "Instance refresh already in progress — continuing"
              exit 0
            fi
            cat refresh.err
            exit 1
          fi
          echo "Instance refresh started"

      # -------------------------
      # WAIT FOR DEPLOYMENT
      # -------------------------
      - name: Wait for deployment
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
        run: |
          if [ -z "$ASG_NAME" ]; then
            echo "ASG_NAME not set — waiting 2 min before health check"
            sleep 120
            exit 0
          fi
          echo "Waiting for instance refresh (up to 30 min)..."
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --max-records 1 \
              --query 'InstanceRefreshes[0].Status' \
              --output text 2>/dev/null || echo "None")
            PCT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --max-records 1 \
              --query 'InstanceRefreshes[0].PercentageComplete' \
              --output text 2>/dev/null || echo "?")
            echo "Refresh status: $STATUS (${PCT}% complete, check $i/60)"
            case "$STATUS" in
              Successful)
                echo "Instance refresh complete"
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance refresh finished with status: $STATUS"
                exit 1
                ;;
              InProgress|Pending)
                sleep 30
                ;;
              *)
                echo "No active refresh — proceeding to health check"
                exit 0
                ;;
            esac
          done
          echo "WARNING: Instance refresh still InProgress after 30 min — continuing to smoke test"
          exit 0

      # -------------------------
      # SMOKE TEST
      # -------------------------
      - name: Smoke Test
        env:
          ALB_DNS_NAME: ${{ secrets.ALB_DNS_NAME }}
        run: |
          if [ -z "$ALB_DNS_NAME" ]; then
            echo "ALB_DNS_NAME secret is not set — skipping smoke test"
            exit 0
          fi
          ALB_HOST="${ALB_DNS_NAME#http://}"
          ALB_HOST="${ALB_HOST#https://}"
          ALB_HOST="${ALB_HOST%%/*}"
          HEALTH_URL="http://${ALB_HOST}/health"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 20); do
            if curl -sf --connect-timeout 10 --max-time 15 "$HEALTH_URL"; then
              echo ""
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/20 failed — retry in 30s"
            sleep 30
          done
          echo "Health check failed after ~10 min of retries"
          exit 1