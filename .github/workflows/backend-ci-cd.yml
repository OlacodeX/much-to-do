name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack

jobs:

  backend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Server/MuchToDo

    steps:

      # -------------------------
      # CHECKOUT CODE
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # -------------------------
      # SETUP GO
      # -------------------------
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache-dependency-path: Server/MuchToDo/go.sum

      # -------------------------
      # INSTALL DEPENDENCIES
      # -------------------------
      - name: Download Dependencies
        run: go mod download

      # -------------------------
      # RUN TESTS
      # -------------------------
      - name: Run Tests
        run: go test ./...

      # -------------------------
      # GOLANG LINT
      # -------------------------
      - name: Run Golang Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          working-directory: Server/MuchToDo

      # -------------------------
      # CONFIGURE AWS
      # -------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # -------------------------
      # LOGIN TO ECR
      # -------------------------
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.1.2

      # -------------------------
      # BUILD IMAGE
      # -------------------------
      - name: Build Docker Image
        run: docker build -t assessment-backend .

      # -------------------------
      # TAG IMAGE
      # -------------------------
      - name: Tag Docker Image
        run: |
          docker tag assessment-backend:latest \
          ${{ secrets.ECR_REPOSITORY }}:latest

      # -------------------------
      # PUSH IMAGE
      # -------------------------
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:latest

      # -------------------------
      # VULNERABILITY SCAN
      # -------------------------
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY }}:latest
          format: table
          exit-code: 0

      # -------------------------
      # INSTANCE REFRESH
      # -------------------------
      - name: Refresh Auto Scaling Group
        env:
          ASG_NAME: ${{ secrets.ASG_NAME }}
        run: |
          if [ -z "$ASG_NAME" ]; then
            echo "ASG_NAME secret is not set — skipping instance refresh"
            exit 0
          fi
          if ! aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" 2>refresh.err; then
            if grep -q InstanceRefreshInProgress refresh.err; then
              echo "Instance refresh already in progress — continuing"
              exit 0
            fi
            cat refresh.err
            exit 1
          fi
          echo "Instance refresh started"

      # -------------------------
      # SMOKE TEST
      # -------------------------
      - name: Smoke Test
        env:
          ALB_DNS_NAME: ${{ secrets.ALB_DNS_NAME }}
        run: |
          if [ -z "$ALB_DNS_NAME" ]; then
            echo "ALB_DNS_NAME secret is not set — skipping smoke test"
            exit 0
          fi
          curl -f "http://${ALB_DNS_NAME}/health"